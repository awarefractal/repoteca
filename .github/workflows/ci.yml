name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Syntax check
        run: |
          node --version
          for f in src/*.mjs; do node --check "$f"; done
      - name: Server starts and answers on localhost
        run: |
          PORT=4799 node src/server.mjs &
          sleep 2
          curl -fsS http://127.0.0.1:4799/api/repos
          curl -s -o /dev/null -w '%{http_code}\n' -H 'Host: evil.example' http://127.0.0.1:4799/api/repos | grep -qx 403
